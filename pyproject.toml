[project]
name = "desktop-tools"
version = "0.1.0"
description = "Modular desktop tools app for Windows"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "websockets>=12",
    "httpx>=0.27",
    "pydantic>=2.7",
    "keyring>=25",
    "tzdata>=2024.1",
    "pywebview>=5.1; sys_platform == 'win32'",
    "pystray>=0.19; sys_platform == 'win32'",
    "pillow>=10; sys_platform == 'win32'",
]

[project.scripts]
dt = "desktop_tools.__main__:main"

[dependency-groups]
dev = ["pytest>=8", "pytest-asyncio>=0.23", "ruff>=0.6", "mypy>=1.10"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["engine/desktop_tools"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests", "tools"]

[tool.ruff]
line-length = 125
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S"]
ignore = ["S101", "S110", "S603", "S607"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S"]
"tools/**/tests/**" = ["S"]
"scripts/new_tool.py" = ["E501"]
